[package]
name = "html2pdf-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8"
base64 = "0.23"
brotli = "9.1.3"
cbc = "0.1"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
pdf-writer = "0.15"
rand = "0.9"
resvg = "0.50"
scraper = "0.29"
ttf-parser = "0.25"
ureq = "2"
